name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Build and Test Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run backend tests
        run: |
          cd backend
          ./mvnw test

      - name: Build backend
        run: |
          cd backend
          ./mvnw package -DskipTests

      - name: Archive backend artifact
        uses: actions/upload-artifact@v3
        with:
          name: backend-artifact
          path: backend/target/*.jar

  frontend:
    name: Build and Test Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend
        run: |
          cd frontend
          npm run build --prod

      - name: Archive frontend artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-artifact
          path: frontend/dist/**/*

  package:
    name: Package Full Application
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v3
        with:
          name: backend-artifact
          path: dist/backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v3
        with:
          name: frontend-artifact
          path: dist/frontend

      - name: List packaged contents
        run: |
          ls -R dist